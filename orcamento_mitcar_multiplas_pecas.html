<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faça seu orçamento | Murilo - Mitcar</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f4f6;
  color:#171717;
}
.container{max-width:520px;margin:0 auto;padding:22px 16px 40px}
.card{
  background:#fff;border-radius:18px;padding:24px;
  box-shadow:0 8px 30px rgba(0,0,0,.08)
}
.header{text-align:center;margin-bottom:22px}
.badge{
  display:inline-block;background:#111;color:#fff;
  padding:7px 12px;border-radius:20px;font-size:12px;font-weight:700;
  margin-bottom:12px
}
h1{font-size:27px;margin:4px 0 7px}
.subtitle{margin:0;color:#666;font-size:14px;line-height:1.45}
label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}
input,select,textarea{
  width:100%;padding:13px 12px;border:1px solid #d8d8d8;
  border-radius:10px;font-size:15px;outline:none;background:#fff
}
input:focus,select:focus,textarea:focus{border-color:#111}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
textarea{min-height:90px;resize:vertical}
button{
  width:100%;border:0;border-radius:12px;padding:15px;
  margin-top:20px;background:#25D366;color:#fff;
  font-size:16px;font-weight:800;cursor:pointer
}
button:hover{filter:brightness(.96)}
.helper{font-size:12px;color:#777;margin-top:6px}
.footer{text-align:center;color:#888;font-size:11px;margin-top:18px}
.required{color:#c00}
.peca-item{border:1px solid #e1e1e1;border-radius:12px;padding:14px;margin-bottom:10px;background:#fafafa}
.peca-title{font-size:13px;font-weight:800;margin-bottom:9px}
.peca-item input{margin-bottom:8px}
.peca-item input:last-child{margin-bottom:0}
.add-piece{margin-top:4px;background:#111;color:#fff;font-size:14px;padding:12px}
.add-piece:hover{filter:brightness(.92)}
.remove-piece{width:auto;margin:0 0 0 8px;padding:8px 10px;background:#eee;color:#333;font-size:12px}
.peca-actions{display:flex;align-items:center;justify-content:space-between}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="header">
      <div class="badge">MITCAR • PEÇAS AUTOMOTIVAS</div>
      <h1>Faça seu orçamento</h1>
      <p class="subtitle">Preencha os dados do seu veículo e diga qual peça você precisa. Vou receber tudo organizado pelo WhatsApp.</p>
    </div>

    <form id="orcamentoForm">
      <label>Nome <span class="required">*</span></label>
      <input id="nome" type="text" placeholder="Seu nome" required>

      <label>WhatsApp <span class="required">*</span></label>
      <input id="telefone" type="tel" placeholder="(64) 99999-9999" required>

      <label>Veículo <span class="required">*</span></label>
      <input id="veiculo" type="text" placeholder="Ex.: Gol, Onix, HB20, Corolla" required>

      <div class="row">
        <div>
          <label>Ano <span class="required">*</span></label>
          <input id="ano" type="text" placeholder="Ex.: 2012" required>
        </div>
        <div>
          <label>Motorização <span class="required">*</span></label>
          <select id="motor" required>
            <option value="">Selecione</option>
            <option>1.0</option>
            <option>1.4</option>
            <option>1.5</option>
            <option>1.6</option>
            <option>1.8</option>
            <option>2.0</option>
            <option>2.2</option>
            <option>2.4</option>
            <option>2.8</option>
            <option>3.0</option>
            <option>3.5</option>
            <option>Outro</option>
            <option>Não sei</option>
          </select>
        </div>
      </div>

      <label>🔧 PEÇAS DO ORÇAMENTO <span class="required">*</span></label>
      <div id="pecasContainer">
        <div class="peca-item">
          <div class="peca-title">Peça 1</div>
          <input class="peca" type="text" placeholder="Ex.: pastilha de freio" required>
          <input class="quantidade" type="number" min="1" value="1" placeholder="Quantidade">
        </div>
      </div>

      <button type="button" id="adicionarPeca" class="add-piece">＋ ADICIONAR OUTRA PEÇA</button>

      <label>Observações</label>
      <textarea id="observacao" placeholder="Ex.: lado direito, dianteiro, com ABS, etc."></textarea>

      <button type="submit">📲 ENVIAR ORÇAMENTO NO WHATSAPP</button>
      <p class="helper">Você será direcionado para o WhatsApp com os dados preenchidos.</p>
    </form>
  </div>
  <div class="footer">Murilo • Vendedor de Peças • Mitcar Distribuidora de Peças</div>
</div>

<script>
const NUMERO_WHATSAPP = "5564992237495"; // TROQUE PELO SEU NÚMERO

document.getElementById("adicionarPeca").addEventListener("click", function(){
  const container = document.getElementById("pecasContainer");
  const numero = container.querySelectorAll(".peca-item").length + 1;

  const item = document.createElement("div");
  item.className = "peca-item";
  item.innerHTML = `
    <div class="peca-actions">
      <div class="peca-title">Peça ${numero}</div>
      <button type="button" class="remove-piece">Remover</button>
    </div>
    <input class="peca" type="text" placeholder="Ex.: disco de freio" required>
    <input class="quantidade" type="number" min="1" value="1" placeholder="Quantidade">
  `;
  container.appendChild(item);
  item.querySelector(".remove-piece").addEventListener("click", function(){
    item.remove();
    [...container.querySelectorAll(".peca-item")].forEach((el, i) => {
      el.querySelector(".peca-title").textContent = `Peça ${i + 1}`;
    });
  });
  item.querySelector(".peca").focus();
});

document.getElementById("orcamentoForm").addEventListener("submit", function(e){
  e.preventDefault();

  const nome = document.getElementById("nome").value.trim();
  const telefone = document.getElementById("telefone").value.trim();
  const veiculo = document.getElementById("veiculo").value.trim();
  const ano = document.getElementById("ano").value.trim();
  const motor = document.getElementById("motor").value;
  const observacao = document.getElementById("observacao").value.trim() || "—";
  const pecas = [...document.querySelectorAll(".peca-item")].map(item => ({
    nome: item.querySelector(".peca").value.trim(),
    quantidade: item.querySelector(".quantidade").value || "1"
  })).filter(item => item.nome);

  if (!pecas.length) {
    alert("Adicione pelo menos uma peça.");
    return;
  }

  const listaPecas = pecas.map((item, index) =>
    `${index + 1}. ${item.nome} — ${item.quantidade} un.`
  ).join("\n");

  const mensagem =
`🚗 NOVO ORÇAMENTO

👤 Nome: ${nome}
📱 WhatsApp: ${telefone}
🚘 Veículo: ${veiculo}
📅 Ano: ${ano}
⚙️ Motor: ${motor}

🔧 PEÇAS DO ORÇAMENTO:
${listaPecas}

📝 OBSERVAÇÃO:
${observacao}

Aguardo o orçamento!`;

  window.open("https://wa.me/" + NUMERO_WHATSAPP + "?text=" + encodeURIComponent(mensagem), "_blank");
});
</script>
</body>
</html>
